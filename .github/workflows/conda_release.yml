name: Publish to Conda

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish_conda:
    name: Build and Upload to Conda
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          python-version: "3.11"
          activate-environment: build
          channels: conda-forge
          channel-priority: strict

      - name: Install Conda Build Tools
        run: |
          conda install -n base -y -c conda-forge conda-build anaconda-client conda-verify
          conda activate base
          conda build --version

      - name: Build Conda Package
        run: |
          conda activate base
          conda build --no-anaconda-upload -c conda-forge recipe/

      - name: Get Package Paths
        run: |
          conda activate base
          conda build --output -c conda-forge recipe/ > package-paths.txt

      - name: Upload to Anaconda Cloud
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          conda activate base
          while IFS= read -r package_path; do
            anaconda upload --user algotom "$package_path"
          done < package-paths.txt
name: Publish to PyPI and Conda

on:
  release:
    types: [published]

jobs:
  publish_pypi:
    name: Build and Upload to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install twine build

      - name: Build package
        run: |
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

  publish_conda:
    name: Build and Upload to Conda
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          python-version: "3.11"
          activate-environment: build
          channels: conda-forge
          channel-priority: strict

      - name: Install Conda Build Tools
        run: |
          conda install -n base -y -c conda-forge conda-build anaconda-client conda-verify
          conda activate base
          conda build --version

      - name: Build Conda Package
        run: |
          conda activate base
          conda build --no-anaconda-upload -c conda-forge recipe/

      - name: Get Package Paths
        run: |
          conda activate base
          conda build --output -c conda-forge recipe/ > package-paths.txt

      - name: Upload to Anaconda Cloud
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          conda activate base
          while IFS= read -r package_path; do
            anaconda upload --user algotom "$package_path"
          done < package-paths.txt
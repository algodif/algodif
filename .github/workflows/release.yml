name: Publish to PyPI and Conda

on:
  release:
    types: [published]

jobs:
  publish_pypi:
    name: Build and Upload to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install twine build

      - name: Build package
        run: |
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

  publish_conda:
    name: Build and Upload to Conda
    runs-on: ubuntu-latest
    defaults:
      run:
        # Login shell is required for setup-miniconda to activate conda
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-update-conda: true
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict
          activate-environment: ""

      - name: Install Conda Build Tools
        run: conda install -y conda-build anaconda-client

      - name: Build Conda Package
        run: conda build -c conda-forge recipe/

      - name: Get Package Path
        run: echo "PACKAGE_PATH=$(conda build -c conda-forge --output recipe/)" >> $GITHUB_ENV

      - name: Upload to Anaconda Cloud
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: anaconda upload --user algotom "$PACKAGE_PATH"
